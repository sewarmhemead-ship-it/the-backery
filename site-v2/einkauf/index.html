<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nachschub · THE BAKERY</title>
<meta name="theme-color" content="#730F23">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/img/icon-180.png">
<link rel="apple-touch-icon" href="../assets/img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nachschub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Open+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="einkauf.css">
</head>
<body>

<header class="top">
  <span class="brand" role="img" aria-label="THE BAKERY"><span class="wordmark"></span></span>
  <span class="tag" data-t="tag">Nachschub</span>
  <div class="lang" role="group" aria-label="Sprache / Language">
    <button type="button" data-lang="de">DE</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="it">IT</button>
    <button type="button" data-lang="ar" lang="ar">ع</button>
  </div>
</header>

<p class="offline" id="offline" role="status" hidden data-t="offline"></p>

<main>
  <!-- 1. Was fehlt? -->
  <section class="view" id="view-need" aria-labelledby="need-h">
    <div class="intro">
      <div class="intro-row">
        <h1 class="display" id="need-h" data-t="needTitle">Was fehlt?</h1>
        <div class="pills">
          <button class="who" type="button" id="who"></button>
          <button class="who icon" type="button" id="bell" hidden></button>
        </div>
      </div>
      <p class="lead" data-t="needLead"></p>
    </div>
    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <span class="sr" data-t="search"></span>
        <input type="search" id="q" autocomplete="off" enterkeyhint="search" data-tp="search">
      </label>
      <nav class="chips" id="chips" aria-label="Kategorien"></nav>
    </div>
    <div id="cats" class="cats"></div>
  </section>

  <!-- 2. Einkaufsliste -->
  <section class="view" id="view-list" aria-labelledby="list-h" hidden>
    <div class="intro list-intro">
      <h1 class="display" id="list-h" data-t="listTitle">Einkaufsliste</h1>
      <p class="lead" id="list-count"></p>
      <div class="list-tools">
        <button type="button" class="btn primary" id="share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5z"/></svg>
          <span data-t="send">Liste senden</span>
        </button>
        <button type="button" class="btn ghost" id="print">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
          <span data-t="print">Drucken</span>
        </button>
      </div>
    </div>
    <div id="list" class="list"></div>
    <div id="bought" class="bought"></div>
  </section>

  <!-- 3. Verlauf: Monatsbericht + Archiv -->
  <section class="view" id="view-history" aria-labelledby="hist-h" hidden>
    <div class="intro">
      <div class="intro-row">
      <h1 class="display" id="hist-h" data-t="histTitle">Verlauf</h1>
      <div class="month-nav">
        <button type="button" class="step small" id="m-prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg><span class="sr" data-t="prevMonth"></span></button>
        <b id="m-label"></b>
        <button type="button" class="step small" id="m-next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span class="sr" data-t="nextMonth"></span></button>
      </div>
      </div>
    </div>
    <div id="history" class="history"></div>
  </section>
</main>

<nav class="tabs" aria-label="Ansicht">
  <button type="button" data-view="need">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><path d="M17.25 13.5v7.5M13.5 17.25H21"/></svg>
    <span data-t="tabNeed">Was fehlt?</span>
  </button>
  <button type="button" data-view="list">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L6.8 5M3.5 12l1.2 1.2 2.1-2.2M3.5 18l1.2 1.2 2.1-2.2"/></svg>
    <span data-t="tabList">Einkaufsliste</span>
    <b class="badge" id="badge" hidden></b>
  </button>
  <button type="button" data-view="history">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span data-t="tabHistory">Verlauf</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" tabindex="-1"></div>
</div>

<div class="pin" id="pin" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="i18n.js"></script>
<script src="einkauf.js"></script>
</body>
</html>
